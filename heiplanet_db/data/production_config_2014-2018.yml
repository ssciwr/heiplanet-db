# J-Model (R0) and P-Model (adults) for 2014-2018 on the global 0.1 degree grid,
# plus both variables aggregated over NUTS regions.
# The local files are read from /data/gold; in docker-compose this is the gold
# folder of heiplanet-data, mounted read-only. For a run outside Docker, point
# `url` at that folder instead (e.g. ../heiplanet-data/.data_heiplanet_db/gold).
data_to_fetch:
  - var_name:
    - type: "definition"
      name: "NUTS-definition"
      unit: "shape"
      grid: "4326"
      level: "gold"
      description: "NUTS shape data using the 4326 grid representation."
    filename: "NUTS_RG_20M_2024_4326.shp.zip"
    host: "heibox"
    url: "https://heibox.uni-heidelberg.de/f/e95125307161470a8906/?dl=1"
    filehash: "246a5e1a3901380f194879cff5a65bbac86c9c906a7871027a3a918dbe6c7e46"
  - var_name:
    - type: "grid"
      name: "R0"
      unit: "1"
      grid: "0.1"
      level: "gold"
      # smooth field: coarser resolutions reuse the 0.1 degree values
      aggregation: "subsample"
      description: "Transmission suitability for West Nile virus for 2014-2018."
    filename: "era5_data_2014-2018_allm_2t_monthly_unicoords_adjlon_celsius_silver_output_JModel_global.nc"
    host: "local"
    url: "/data/gold"
  - var_name:
    - type: "grid"
      name: "adults_log10"
      # variable name in the P-Model files
      source_variable: "adults"
      unit: "log10(mosquitoes per 625 km²)"
      grid: "0.1"
      level: "gold"
      # the P-Model output is a density (per fixed 625 km² reference area, see
      # heiplanet-models#86), so coarser resolutions are area-weighted means
      aggregation: "mean"
      # ocean cells are 0 in the P-Model output; keep only cells where R0 exists
      mask_by: "R0"
      # stored as log10(max(value, 1)) so that the frontend's linear colour
      # scale shows the ~10 orders of magnitude; the means are taken first
      transform: "log10"
      transform_floor: 1
      description: "Adult mosquito abundance (P-Model), monthly mean, 2014-2018, as log10 of mosquitoes per 625 km²; values below 1 are stored as 0. Coarser resolutions are area-weighted means over the 0.1 degree cells, taken before the logarithm."
    filename:
      - "Mosquito_abundance_Global_2014.nc"
      - "Mosquito_abundance_Global_2015.nc"
      - "Mosquito_abundance_Global_2016.nc"
      - "Mosquito_abundance_Global_2017.nc"
      - "Mosquito_abundance_Global_2018.nc"
    host: "local"
    url: "/data/gold"
  - var_name:
    - type: "nuts"
      name: "R0"
      unit: "1"
      grid: "NUTS"
      level: "gold"
      description: "Transmission suitability for West Nile virus for 2014-2018, NUTS grid."
    - type: "nuts"
      name: "adults_log10"
      source_variable: "adults"
      unit: "log10(mosquitoes per 625 km²)"
      grid: "NUTS"
      level: "gold"
      transform: "log10"
      transform_floor: 1
      description: "Adult mosquito abundance (P-Model), monthly mean, 2014-2018, as log10 of the area-weighted mean over each NUTS region; values below 1 are stored as 0."
    filename: "NUTS_RG_20M_2024_4326_agg_jmodel_pmodel_2014-01-2018-12.nc"
    host: "local"
    url: "/data/gold"
datalake:
  bronze: ".data_heiplanet_db/bronze"
  silver: ".data_heiplanet_db/silver"
  gold: ".data_heiplanet_db/gold"
