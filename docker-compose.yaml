services:

  frontend:
    image: ghcr.io/ssciwr/heiplanet-frontend:main # this should also change to main soon
    # master process as root to read the Let's Encrypt private key;
    # nginx workers still run as the "nginx" user (see nginx.main.conf)
    user: root
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./nginx/conf/nginx.main.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Let's Encrypt certificates maintained by certbot on the host
      # (whole tree: live/ contains symlinks into archive/)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # webroot for the ACME HTTP-01 challenge (certbot --webroot -w /var/www/certbot)
      - /var/www/certbot:/var/www/certbot:ro
    logging:
      driver: "local"
      options:
        max-size: 20m
        max-file: 25
    networks:
      - heiplanet-network
  db:
    image: postgis/postgis:17-3.5
    restart: always
    shm_size: "512m"
    mem_limit: 4g
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "work_mem=256MB"
      - "-c"
      - "maintenance_work_mem=1GB"
      - "-c"
      - "effective_cache_size=2GB"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "autovacuum_max_workers=4"
      - "-c"
      - "autovacuum_naptime=10s"
      # parallel hash joins keep their hash tables in /dev/shm (shm_size), which
      # is too small for requests over the whole globe at 0.2 degree
      - "-c"
      - "enable_parallel_hash=off"
    ports:
      - "5445:5432"
    env_file: ./.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d heiplanet_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - heiplanet-network

  # FastAPI Application service (Stage 2)
  api:
    image: ghcr.io/ssciwr/heiplanet-db:main
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      frontend:
        condition: service_started
    env_file: ./.env
    volumes:
      - ./heiplanet_db/data/production_config_2014-2018.yml:/heiplanet_db/production.yaml
    command: [ "api" ] # Run FastAPI server
    restart: "no"
    networks:
      - heiplanet-network
    profiles: [ "api" ]

  production-runner:
    image: ghcr.io/ssciwr/heiplanet-db:main
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file: ./.env
    volumes:
      - ./heiplanet_db/data/production_config_2014-2018.yml:/heiplanet_db/production.yaml
      # gold data from heiplanet-data, read by the `host: local` config entries
      - ../heiplanet-data/.data_heiplanet_db/gold:/data/gold:ro
    command: [ "production" ]
    restart: "no" # Run once
    networks:
      - heiplanet-network
    profiles: [ "init" ]

volumes:
  postgres_data:


networks:
  heiplanet-network:
    driver: bridge
