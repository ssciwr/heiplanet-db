# Server config for the heiplanet frontend image (ghcr.io/ssciwr/heiplanet-frontend).
#
# Mounted over the image's own /etc/nginx/conf.d/default.conf, so it replaces
# the built-in server block instead of running next to it.
#
# It listens on unprivileged ports (the image was built for a non-root
# nginx); docker-compose maps host 80 -> 8080 and 443 -> 8443.
#
# TLS uses the Let's Encrypt certificate for platform.hei-planet.com that
# certbot maintains on the host. docker-compose mounts the host's
# /etc/letsencrypt (read-only, whole tree, because live/ holds symlinks into
# archive/) and /var/www/certbot (webroot for the HTTP-01 challenge).
# nginx will not start if the certificate is missing.

# --- HTTP: ACME challenge, everything else redirected to HTTPS ---------------
server {
    listen 8080 default_server;
    server_name _;

    # Let's Encrypt HTTP-01 challenge. On the host, issue/renew with
    #     certbot certonly --webroot -w /var/www/certbot -d platform.hei-planet.com
    # "^~" keeps the static-asset regex location from matching these paths.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://platform.hei-planet.com$request_uri;
    }
}

# --- HTTP: container healthcheck --------------------------------------------
# The image's HEALTHCHECK runs `wget http://127.0.0.1:8080/` inside the
# container. It would fail on the redirect above (nothing listens on 443
# inside the container), so loopback requests get the app directly.
server {
    listen 8080;
    server_name 127.0.0.1 localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# --- HTTPS: the application ----------------------------------------------------
server {
    listen 8443 ssl;
    http2 on;
    server_name platform.hei-planet.com;

    ssl_certificate     /etc/letsencrypt/live/platform.hei-planet.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/platform.hei-planet.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to the FastAPI backend (service "api", port 8000).
    # The frontend calls /api/cartesian, /api/nuts_data, /api/nuts_regions;
    # the backend serves them without the /api prefix, so it is stripped.
    location /api/ {
        # Resolve "api" per request through Docker's embedded DNS. With a
        # static proxy_pass nginx refuses to start while the api container
        # is not running (it starts after the frontend and sits behind the
        # "api" profile):  [emerg] host not found in upstream "api"
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Whole-globe requests at high resolution can be slow.
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Large GeoJSON responses.
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 16 64k;
        proxy_busy_buffers_size 128k;

        client_max_body_size 10M;
    }

    # Serve the app under /heiplanet-frontend/ as well. "^~" keeps the
    # static-asset regex below from taking these requests (it would use
    # "root" instead of "alias" and return 404).
    location ^~ /heiplanet-frontend/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /heiplanet-frontend/index.html;
    }

    # Long-lived caching for static assets.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
